# ===================================================================
# Driver Service Configuration
# Default Port: 8081 (Can also run on 8082 via profile or VM arg)
# ===================================================================
spring.application.name=driver-service
server.port=8081

# Eureka Client Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Instance Identification - ensures Eureka treats multiple instances on localhost distinctly
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.uuid}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
