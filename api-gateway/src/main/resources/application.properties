# ===================================================================
# API Gateway Configuration
# Port: 8080
# Round-Robin Load Balancing to driver-service (8081, 8082) via Eureka
# ===================================================================
server.port=8080
spring.application.name=api-gateway

# Eureka Service Discovery Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Spring Cloud LoadBalancer: Disable caching to ensure instantaneous round-robin alternation
spring.cloud.loadbalancer.cache.enabled=false

# Spring Cloud Gateway Routing: lb://driver-service invokes Spring Cloud LoadBalancer
spring.cloud.gateway.routes[0].id=driver-service-route
spring.cloud.gateway.routes[0].uri=lb://driver-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/drivers/**

# Optional: Enable Discovery Client Route Locator as fallback / alternative syntax
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Actuator monitoring endpoints
management.endpoints.web.exposure.include=gateway,health,info,routes
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.com.example.apigateway=INFO
